[tool:pytest]
testpaths = tests
asyncio_mode = auto
log_cli = true
log_cli_level = WARNING

[coverage:run]
source = .
omit =
    tests/*
    test_mqtt_integration.py
    test_setup*.py
    publish_chart_seed.py
    setup_database.py
    __pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
show_missing = true
