name: CI — FillXpert Test Suite

# ─────────────────────────────────────────────────────────────────────────────
# Triggers: every push + every PR to main or develop
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Backend unit + API integration tests
  # ═══════════════════════════════════════════════════════════════════════════
  backend-tests:
    name: Backend Tests (pytest + coverage)
    runs-on: ubuntu-latest

    # SQLite is used in tests — no PostgreSQL service needed here
    # (PostgreSQL is only needed for the live MQTT integration test in Job 3)

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (no DB/network required)
        run: |
          pytest tests/test_unit_parsing.py tests/test_unit_devices.py \
            -v --tb=short

      - name: Run API integration tests with coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-minimum-32-chars!!"
          MQTT_BROKER_HOST: "localhost"
          MQTT_BROKER_PORT: "1883"
          ENVIRONMENT: "test"
        run: |
          pytest tests/ -v --tb=short \
            --cov=. \
            --cov-omit="tests/*,test_mqtt_integration.py,test_setup*.py,publish_chart_seed.py,setup_database.py" \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./backend
          flags: backend
          fail_ci_if_error: false


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Frontend tests (Jest + React Testing Library)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run all frontend tests with coverage
        run: |
          npm test -- \
            --coverage \
            --watchAll=false \
            --passWithNoTests \
            --coverageReporters=text,lcov
        env:
          CI: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./frontend/coverage
          flags: frontend
          fail_ci_if_error: false


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — Static analysis (linting)
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: Static Analysis (flake8 + eslint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python linting ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (backend)
        run: |
          flake8 backend/ \
            --max-line-length=120 \
            --exclude=__pycache__,test_setup*.py,publish_chart_seed.py \
            --count --statistics

      # ── JavaScript linting ──────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run ESLint (frontend)
        run: cd frontend && npx eslint src/ --max-warnings 20
        continue-on-error: true   # warnings don't block CI; errors still fail


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 — Live MQTT integration tests (only on push to main, not PRs)
  # Requires the full Docker stack — runs against a real MQTT broker
  # ═══════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Live MQTT Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-tests]   # only run if unit tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start full Docker Compose stack
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 20   # wait for PostgreSQL + backend + MQTT to initialise

      - name: Check backend health
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:8000/ \
            || (docker compose logs backend && exit 1)

      - name: Set up Python 3.11 (for test runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner dependencies
        run: pip install aiomqtt psycopg2-binary websockets

      - name: Register test device (preflight for integration test)
        run: |
          # Register user
          curl -s -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_test","email":"ci@test.io","password":"CiTest123!","full_name":"CI"}' || true
          # Login to get token
          TOKEN=$(curl -s -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_test","password":"CiTest123!"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          # Register test device
          curl -s -X POST http://localhost:8000/api/devices \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"device_id":"TESTDEV001","location":"chandigarh","sensor_type":"moisture"}' || true

      - name: Run MQTT integration tests (9 tests)
        run: |
          cd backend
          python test_mqtt_integration.py
        env:
          MQTT_BROKER_HOST: localhost
          MQTT_BROKER_PORT: "1883"
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_NAME: lorawan_db
          DB_USER: lorawan_user
          DB_PASS: lorawan_pass
          WS_URL: "ws://localhost:8000/ws/realtime"

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker stack
        if: always()
        run: docker compose down
